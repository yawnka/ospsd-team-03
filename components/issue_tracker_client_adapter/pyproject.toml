[project]
name = "issue-tracker-client-adapter"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "issue-tracker-client-api",
    "issue-tracker-client-service-client",
    "ospd-issue-tracker-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_tracker_client_adapter"]

[tool.uv.sources]
issue-tracker-client-api = { workspace = true }
issue-tracker-client-service-client = { workspace = true }
ospd-issue-tracker-api = { git = "https://github.com/tatyanacthomas/ospd_issue_tracker.git", branch = "main" }
