[project]
name = "issue-tracker-client-service"
version = "0.1.0"
description = "FastAPI service for the Trello-based issue tracker client"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn>=0.30.6",
    "issue-tracker-client-api",
    "issue-tracker-client-impl",
    "ospd-issue-tracker-api",
    "pydantic>=2.11.7",
    "httpx>=0.27.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "chat-client-api",
    "discord-client-impl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_tracker_client_service"]

[tool.uv.sources]
issue-tracker-client-api = { workspace = true }
issue-tracker-client-impl = { workspace = true }
ospd-issue-tracker-api = { git = "https://github.com/tatyanacthomas/ospd_issue_tracker.git", branch = "main" }
chat-client-api = { git = "https://github.com/HarshithKoriRaj/Shared-API.git" }
discord-client-impl = { git = "https://github.com/helinyi/ospsd-team-08.git", subdirectory = "components/discord_client_impl", rev = "hw3-ai-integration" }
