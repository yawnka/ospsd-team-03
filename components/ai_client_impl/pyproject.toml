[project]
name = "ai-client-impl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "ai-client-api",
  "openai>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai-client-impl"]

[tool.uv.sources]
ai-client-api = { workspace = true }