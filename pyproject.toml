# ── Workspace ────────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = ["components/*", "src/*"]

# ── Dev dependencies (PEP 735 dependency groups) ──────────────────────────────
[dependency-groups]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["components", "src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # trailing-comma-missing — conflicts with ruff format
    "ISC001", # implicit-str-concat — conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D101",
    "D102",
    "INP001",
    "S101",
    "SLF001",
]

"components/**/tests/**/*.py" = [
    "D101",
    "D102",
    "D100",
    "INP001",
    "S101",
    "SLF001",
]

[tool.ruff.format]
# use ruff format defaults (black-compatible)

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true
exclude = [
  "^tests/",
  "^components/.*/tests/",
]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests", "components"]
addopts = ["--cov", "--cov-report=term-missing"]
markers = [
    "e2e: marks tests as end-to-end tests (slow, full system)",
    "local_credentials: requires API tokens not available in CI",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["components", "src"]
branch = true

[tool.coverage.report]
show_missing = true
