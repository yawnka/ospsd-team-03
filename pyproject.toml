# ── Workspace ────────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = ["components/*"]

# ── Dev dependencies (PEP 735 dependency groups) ──────────────────────────────
[dependency-groups]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mkdocs>=1.6",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=1.0.3",
    "mkdocstrings-python>=1.0.0",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["components"]
exclude = ["components/issue_tracker_client_service_client"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # trailing-comma-missing — conflicts with ruff format
    "ISC001", # implicit-str-concat — conflicts with ruff format
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D101",
    "D102",
    "INP001",
    "S101",
    "SLF001",
]

"components/**/tests/**/*.py" = [
    "D101",
    "D102",
    "D100",
    "INP001",
    "S101",
    "SLF001",
]

"components/**/src/main.py" = [
    "INP001",  # standalone dev entry point, not a package module
]

[tool.ruff.format]
# use ruff format defaults (black-compatible)

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true
exclude = [
  "^tests/",
  "^components/.*/tests/",
  "^components/issue_tracker_client_service_client/",
]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests", "components"]
addopts = ["--cov", "--cov-report=term-missing"]
markers = [
    "unit: marks tests as unit tests (fast, isolated)",
    "integration: marks tests as integration tests (medium speed, real dependencies)",
    "e2e: marks tests as end-to-end tests (slow, full system)",
    "local_credentials: marks tests that require real API credentials (skipped in CI)",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["components"]
branch = true
omit = ["components/issue_tracker_client_service_client/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85 # Justification: A high threshold ensures most code is tested.
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
