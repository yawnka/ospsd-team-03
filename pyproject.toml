# ── Workspace ────────────────────────────────────────────────────────────────
[tool.uv.workspace]
members = ["src/*"]

# ── Dev dependencies (PEP 735 dependency groups) ──────────────────────────────
[dependency-groups]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # trailing-comma-missing — conflicts with ruff format
    "ISC001", # implicit-str-concat — conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D101",   # class docstrings optional in test helpers
    "D102",   # method docstrings optional in test helpers
    "INP001", # not a namespace package — tests/ intentionally has no __init__.py
    "S101",   # assert — expected in test files
    "SLF001", # private member access OK in tests
]

[tool.ruff.format]
# use ruff format defaults (black-compatible)

# ── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
strict = true

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov", "--cov-report=term-missing"]
markers = [
    "e2e: marks tests as end-to-end tests (slow, full system)",
]

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
