site_name: OSPSD Team 03 Issue Tracker
repo_name: ospsd-team-03
repo_url: https://github.com/yawnka/ospsd-team-03

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  features:
    - navigation.tabs
    - content.code.copy

nav:
  - Overview: index.md
  - Architecture:
      - Design & Decisions: design.md
      - Component Guide: component.md
  - Components:
      - Issue Tracker API: components/issue_tracker_client_api.md
      - Trello Implementation: components/issue_tracker_client_impl.md
      - FastAPI Service: components/issue_tracker_client_service.md
      - Service Client: components/issue_tracker_client_service_client.md
      - Service Adapter: components/issue_tracker_client_adapter.md
      - AI Client API: components/ai_client_api.md
      - AI Client (OpenAI): components/ai_client_impl.md
  - Infrastructure:
      - Terraform & Cloud Run: infrastructure.md
      - Observability: observability.md
  - Development:
      - Testing Strategy: testing.md
      - CircleCI & Deployment: circleci-setup.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - components/issue_tracker_client_api/src
            - components/issue_tracker_client_impl/src
            - components/ai_client_api/src
            - components/ai_client_impl/src
          options:
            show_source: false
            docstring_section_style: spacy
            members_order: source