# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Reusable commands
commands:
  detect-code-dir:
    description: "Detect whether the project uses components/ or src/ as code directory"
    steps:
      - run:
          name: "Detect Code Directory"
          command: |
            if [ -d "components" ]; then
              echo 'export CODE_DIR="components"' >> $BASH_ENV
            elif [ -d "src" ]; then
              echo 'export CODE_DIR="src"' >> $BASH_ENV
            else
              echo "ERROR: Neither components/ nor src/ found" && exit 1
            fi
            source $BASH_ENV
            echo "Using code directory: $CODE_DIR"

# Define jobs to be invoked later in a workflow.
jobs:
  # Job 1: Setup Environment and Install All Dependencies
  build:
    docker:
      - image: cimg/python:3.13 # Match project requires-python >= 3.12
    steps:
      - checkout
      - run:
          name: "Install UV and Add to Path"
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> $BASH_ENV
            source $BASH_ENV
            uv --version # Verify installation
      - run:
          name: "Create Virtual Env & Install All Dependencies via UV Sync"
          command: |
            # Use system Python to ensure venv symlinks survive persist_to_workspace
            uv venv --python $(which python3.13)
            source .venv/bin/activate
            # Install all workspace packages and dev dependency group (PEP 735)
            uv sync --all-packages --group dev --verbose
      - run:
          name: "Verify Installation"
          command: |
            source .venv/bin/activate
            uv tree # Check if workspace members and tools are listed
            ruff --version
            pytest --version
            mypy --version
            coverage --version
      - persist_to_workspace:
          # Persist the entire project directory, including the populated .venv
          root: .
          paths:
            - .

  # Job 2: Linting and Formatting Checks
  lint:
    docker:
      - image: cimg/python:3.13
    steps:
      - attach_workspace:
          at: . # Attach the workspace persisted from 'build'
      - run:
          name: "Run Linting and Formatting Checks"
          command: |
            source .venv/bin/activate
            ruff check .

  # Job 3: Unit Tests, Coverage, and Static Analysis
  unit_test:
    docker:
      - image: cimg/python:3.13
    steps:
      - attach_workspace:
          at: .
      - detect-code-dir
      - run:
          name: "Create Test Results Directory"
          command: mkdir -p test-results/unit
      - run:
          name: "Execute Unit Test Suite"
          command: |
            source .venv/bin/activate
            pytest $CODE_DIR tests/ \
                     --cov=$CODE_DIR \
                     --cov-report=xml --cov-report=term \
                     --junitxml=test-results/unit/junit.xml \
                     --cov-fail-under=85
      - store_test_results:
          path: test-results/unit
      - store_artifacts:
          path: coverage.xml
      - store_artifacts:
          path: test-results/unit
      - persist_to_workspace:
          root: .
          paths:
            - .coverage
            - coverage.xml

  # Job 4: Static Analysis
  type_check:
    docker:
      - image: cimg/python:3.13
    steps:
      - attach_workspace:
          at: .
      - run:
          name: "Run Static Analysis (mypy)"
          command: |
            source .venv/bin/activate
            mypy -p issue_tracker_client_api -p issue_tracker_client_impl --explicit-package-bases

  # Job 5: Integration Tests with Real Credentials
  integration_test:
    docker:
      - image: cimg/python:3.13
    steps:
      - attach_workspace:
          at: .
      - run:
          name: "Verify Environment Variables"
          command: |
            echo "Checking for required environment variables..."
            if [ -z "$TRELLO_API_KEY" ] || [ -z "$TRELLO_API_TOKEN" ] || [ -z "$TRELLO_BOARD_ID" ]; then
              echo "WARNING: Missing Trello environment variables."
              echo "Required: TRELLO_API_KEY, TRELLO_API_TOKEN, TRELLO_BOARD_ID"
            else
              echo "All required environment variables are present."
            fi
      - run:
          name: "Create Test Results Directory"
          command: mkdir -p test-results/integration
      - run:
          name: "Execute Integration Test Suite"
          command: |
            source .venv/bin/activate
            # Run integration tests that require real API connectivity
            pytest tests/integration/ \
                   --junitxml=test-results/integration/junit.xml -v \
                   --no-cov
      - store_test_results:
          path: test-results/integration
      - store_artifacts:
          path: test-results/integration

  # Job 6: Coverage Report - generates browsable HTML coverage report
  coverage_report:
    docker:
      - image: cimg/python:3.13
    steps:
      - attach_workspace:
          at: .
      - run:
          name: "Generate HTML Coverage Report"
          command: |
            source .venv/bin/activate
            coverage html -d htmlcov
      - store_artifacts:
          path: htmlcov
          destination: coverage-report

  # Job 7: Build Docker image and push to GCP Artifact Registry
  build_and_push_image:
    docker:
      - image: google/cloud-sdk:slim
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: "Install Docker CLI"
          command: |
            apt-get update && apt-get install -y --no-install-recommends docker.io && rm -rf /var/lib/apt/lists/*
      - run:
          name: "Authenticate to GCP"
          command: |
            echo "$GOOGLE_CREDENTIALS_B64" | base64 -d > /tmp/gcp-key.json
            gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
            gcloud config set project "$GCP_PROJECT_ID"
      - run:
          name: "Configure Docker for Artifact Registry"
          command: |
            gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
      - run:
          name: "Build and Push Docker Image"
          command: |
            REGION="$(echo "${GCP_REGION}" | tr -d '[:space:]')"
            PROJECT="$(echo "${GCP_PROJECT_ID}" | tr -d '[:space:]')"
            IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/issue-tracker/service"
            docker build -t "${IMAGE}:${CIRCLE_SHA1}" -t "${IMAGE}:latest" .
            docker push "${IMAGE}:${CIRCLE_SHA1}"
            docker push "${IMAGE}:latest"

  # Job 8: Terraform Plan — preview infrastructure changes
  terraform_plan:
    docker:
      - image: hashicorp/terraform:1.9
    steps:
      - checkout
      - run:
          name: "Terraform Init & Plan"
          command: |
            echo "$GOOGLE_CREDENTIALS_B64" | base64 -d > /tmp/gcp-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
            cd infrastructure/terraform
            terraform init -input=false
            terraform plan -input=false -lock-timeout=120s \
              -var="enable_service=true" \
              -var="image_tag=${CIRCLE_SHA1}" \
              -var="redirect_uri=${TF_VAR_redirect_uri}"

  # Job 9: Terraform Apply — deploy infrastructure (hw-3 branch only)
  # Persists the service URL so verify_health can read it without manual config.
  terraform_apply:
    docker:
      - image: hashicorp/terraform:1.9
    steps:
      - checkout
      - run:
          name: "Terraform Init & Apply"
          command: |
            echo "$GOOGLE_CREDENTIALS_B64" | base64 -d > /tmp/gcp-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
            cd infrastructure/terraform
            terraform init -input=false
            terraform apply -auto-approve -input=false -lock-timeout=120s \
              -var="enable_service=true" \
              -var="image_tag=${CIRCLE_SHA1}" \
              -var="redirect_uri=${TF_VAR_redirect_uri}"
      - run:
          name: "Export service URL"
          command: |
            echo "$GOOGLE_CREDENTIALS_B64" | base64 -d > /tmp/gcp-key.json
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json
            cd infrastructure/terraform
            terraform output -raw service_url > /tmp/service_url.txt
      - persist_to_workspace:
          root: /tmp
          paths:
            - service_url.txt

  # Job 10: Verify health after deployment
  # Reads the Cloud Run URL from Terraform output (persisted by terraform_apply).
  verify_health:
    docker:
      - image: cimg/base:current
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: "Wait for Cloud Run revision to become ready"
          command: sleep 30
      - run:
          name: "Health Check"
          command: |
            SERVICE_URL=$(cat /tmp/workspace/service_url.txt)
            echo "Checking health at: ${SERVICE_URL}/health"
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}/health" || true)
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed (attempt $i)"
                exit 0
              fi
              echo "Attempt $i: status=$STATUS, retrying in 10s..."
              sleep 10
            done
            echo "Health check failed after 5 attempts"
            exit 1


# Orchestrate jobs using workflows
workflows:
  # Main workflow: Build, Lint, Test (runs on all branches)
  build_and_test:
    jobs:
      - build
      - lint:
          requires:
            - build
      - type_check:
          requires:
            - build
      - unit_test:
          requires:
            - build
      - integration_test:
          requires:
            - unit_test
      - coverage_report:
          requires:
            - unit_test
            - integration_test

  # Deploy workflow: Build image → Terraform → Health check
  deploy_to_cloud_run:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
                - hw-3
                - feat/iac-terraform
      - lint:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - hw-3
                - feat/iac-terraform
      - type_check:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - hw-3
                - feat/iac-terraform
      - unit_test:
          requires:
            - build
          filters:
            branches:
              only:
                - main
                - hw-3
                - feat/iac-terraform
      - build_and_push_image:
          requires:
            - lint
            - type_check
            - unit_test
          filters:
            branches:
              only:
                - main
                - hw-3
                - feat/iac-terraform
      - terraform_plan:
          requires:
            - build_and_push_image
          filters:
            branches:
              only:
                - main
                - hw-3
                - feat/iac-terraform
      - terraform_apply:
          requires:
            - terraform_plan
          filters:
            branches:
              only:
                - main
                - hw-3
                - feat/iac-terraform
      - verify_health:
          requires:
            - terraform_apply
          filters:
            branches:
              only:
                - main
                - hw-3
                - feat/iac-terraform
